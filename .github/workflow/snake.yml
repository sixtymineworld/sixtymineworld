name: generate animation

on:
  # Запуск автоматично раз на день
  schedule:
    - cron: "0 0 * * *"
  # Можливість запуску вручну з вкладки Actions
  workflow_dispatch:
  # Запуск при кожному пуші в головну гілку
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Завантаження репозиторію
      - name: checkout
        uses: actions/checkout@v3

      # 2. Генерація файлів звітів / SVG-змійки
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Публікація в окрему гілку (output)
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
